services:
  app:
    container_name: pdf-extractext-api
    image: pdf-extractext:${APP_VERSION:-1.0.0}
    environment:
      - TZ=America/Argentina/Mendoza
    build:
      context: ../
      dockerfile: infra/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    networks:
      - pdfnet

networks:
  pdfnet:
    name: red_compartida_pdf
    driver: bridge
