services:
  pdf-extractext:
    image: pdf-extractext:${APP_VERSION:-1.0.0}
    container_name: pdf-extractext
    environment:
      - TZ=America/Argentina/Mendoza
    build:
      context: ../
      dockerfile: infra/Dockerfile
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    networks:
      - pdfnet
    depends_on:
      db:
        condition: service_healthy

networks:
  pdfnet:
    driver: bridge
